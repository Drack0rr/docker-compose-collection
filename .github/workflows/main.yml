name: master
on:
  push:
    branches: [ master ]
    tags: ['v*']
  workflow_dispatch:
jobs:
  check-yaml:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/check-yaml.yml
  generate-files:
    needs: check-yaml
    if: >-
      !cancelled() && github.ref == 'refs/heads/master' &&
      ((github.event_name == 'push' && needs.check-yaml.result == 'skipped') ||
      (github.event_name == 'workflow_dispatch' && needs.check-yaml.result == 'success'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Generate json file
        run: python3 .github/workflows/generate-template-json.py
      - name: update file and push to remote
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Automatic generation of the file templates-portainer.json"
          git push
